<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publications | Najwa Alshehri</title>

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #1f2933;
      margin: 0;
      padding: 32px;
      line-height: 1.6;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 8px;
      color: #172b3a;
    }

    .intro {
      margin-bottom: 28px;
      color: #5b6570;
      font-size: 1rem;
    }

    a {
      color: #2f6f6d;
    }

    .bibbase_group {
      margin-top: 30px;
    }

    .bibbase_group > div:first-child {
      font-size: 1.35rem;
      font-weight: 700;
      color: #172b3a;
      margin-bottom: 12px;
      border-bottom: 1px solid #dfe3e6;
      padding-bottom: 6px;
    }

    .bibbase_paper {
      margin-bottom: 22px;
      padding-bottom: 16px;
      border-bottom: 1px solid #eeeeee;
    }

    .bibbase_paper_title {
      font-weight: 600;
    }

    .bibbase_icon_text {
      font-size: 0.9rem;
    }

    #bibbase_header {
      display: none;
    }
  </style>
</head>

<body>
  <div class="container">

    <h1>Publications</h1>

    <div class="intro">
      Complete list of publications and research outputs, organized by year.
    </div>

    <script
      src="https://bibbase.org/show?bib=https%3A%2F%2Fraw.githubusercontent.com%2FNajwaalshehri%2Fpublications%2Fmain%2Fpublications.bib&group0=year&sort=-year&commas=true&jsonp=1">
    </script>

  </div>
</body>
</html>
